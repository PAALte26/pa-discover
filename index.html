<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اكتشف عطرك القادم | باريس أفنيوز</title>
<meta name="theme-color" content="#732D69">
<script>(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script","yvldr90dra");</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#732D69;--berry:#A7246C;--rose:#c25a8f;--gold:#c8a46a;--gold2:#e6cf9f;
  --ink:#1f1522;--mute:#7b6f7e;--line:rgba(115,45,105,.13);--cream:#fbf7f4;--blush:#f7ecf2;--blush2:#fdf6f9;
  --ok:#1f8a4c;--bad:#b42d3c;--sh:0 10px 30px -12px rgba(115,45,105,.28);--sh2:0 2px 10px rgba(31,21,34,.06);
  --ease:cubic-bezier(.22,1,.36,1);--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--display:var(--font)
}
html[lang=en]{--font:"IBM Plex Sans","Segoe UI",sans-serif;--display:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font:16px/1.7 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--berry)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
html[dir=ltr] svg.flip{transform:scaleX(-1)}

/* الخلفية: ضباب متحرك وذرّات ذهبية */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:#efd3e2;top:-18vmax;left:-12vmax}
.bg i:nth-child(2){width:38vmax;height:38vmax;background:#f3e2cf;bottom:-16vmax;right:-10vmax;animation-delay:-7s}
.bg i:nth-child(3){width:28vmax;height:28vmax;background:#e7d6ee;top:38%;left:40%;animation-delay:-13s;opacity:.35}
.bg b{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:0;animation:rise-dot 14s linear infinite;box-shadow:0 0 8px var(--gold2)}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes rise-dot{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.55}100%{transform:translateY(-105vh) scale(1);opacity:0}}

/* الترويسة */
.hd{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px;background:rgba(251,247,244,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd img{height:36px;display:block}
.hd .store{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--plum);font-size:14px;font-weight:500}
.hd .store svg{width:18px;height:18px}
.lang{justify-self:end;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--plum);transition:.2s}
.lang:hover{border-color:var(--berry)}.lang svg{width:16px;height:16px}

/* التخطيط */
.layout{max-width:1200px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:28px}
.stage{min-width:0}
.show{display:none}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 430px;padding:28px 28px 56px;align-items:start}
  .show{display:block;position:sticky;top:86px;height:calc(100vh - 120px);min-height:560px;border-radius:32px;overflow:hidden;color:#fff;
        background:radial-gradient(120% 90% at 85% 0%,#c25a8f 0%,rgba(194,90,143,0) 55%),linear-gradient(165deg,#5e2357 0%,#732D69 45%,#A7246C 100%);box-shadow:var(--sh)}
  .stage{max-width:620px;width:100%;justify-self:center}
  .is-results .stage{max-width:none}
  .is-results .layout{grid-template-columns:minmax(0,1fr) 360px}
  .m-only{display:none!important}
}

/* لوحة العرض */
.show .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 65%);top:8%;left:50%;transform:translateX(-50%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.12);opacity:.7}}
.show .in{position:relative;height:100%;display:flex;flex-direction:column;padding:34px 34px 30px}
.show .kick{font-size:12px;letter-spacing:1.5px;opacity:.75;text-transform:uppercase}
.show h3{font:600 27px/1.4 var(--display);margin:6px 0 0}
html[lang=en] .show h3{font-size:32px;line-height:1.15}
.show .lead{opacity:.82;font-size:14px;margin-top:4px}
.show .sum{margin-top:auto}
.show .sum b{display:block;font-size:12.5px;font-weight:500;opacity:.75;margin-bottom:8px}
.show .tags{display:flex;flex-wrap:wrap;gap:7px}
.show .tags span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:13.5px;animation:pop .45s var(--ease) both}
.show .bars{margin-top:14px}.show .bars .t{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-top:6px}
.show .bars .t span{flex:0 0 140px}.show .bars .t i{display:block;height:6px;border-radius:9px;background:linear-gradient(90deg,#fff,var(--gold2));transition:width .5s var(--ease)}

/* مروحة القوارير */
.fan{position:relative;height:290px;margin:22px 0 8px;direction:ltr}
.fan figure{position:absolute;top:30px;left:50%;width:136px;height:186px;margin:0 0 0 -68px;border-radius:22px;background:#fff;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  transform:translateX(calc(var(--x) * 1px)) translateY(calc(var(--y) * 1px)) rotate(calc(var(--r) * 1deg));animation:bob 6s ease-in-out infinite;animation-delay:calc(var(--d) * -1s);transition:transform .6s var(--ease)}
.fan figure img{width:82%;height:82%;object-fit:contain}
.fan:hover figure{transform:translateX(calc(var(--x) * 1.25px)) translateY(calc(var(--y) * 1px - 6px)) rotate(calc(var(--r) * 1.3deg))}
@keyframes bob{50%{translate:0 -10px}}
.hero{position:relative}
.hero::before{content:"";position:absolute;inset:10% 15% 20%;background:radial-gradient(circle,rgba(167,36,108,.18),transparent 70%);filter:blur(20px)}
.hero .fan{height:210px;margin:0 -10px;transform:scale(.84);transform-origin:50% 30%}
.hero .fan figure{width:112px;height:152px;margin-left:-56px;top:18px}

/* التقدّم */
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--plum);padding:6px 2px;font-size:14.5px;font-weight:500}
.back svg{width:18px;height:18px}
.step{font-size:13px;color:var(--mute)}
.prog{position:relative;height:4px;border-radius:9px;background:rgba(115,45,105,.1);margin-bottom:22px}
.prog i{position:relative;display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--plum),var(--berry));transition:width .6s var(--ease)}
html[dir=rtl] .prog i{background:linear-gradient(270deg,var(--plum),var(--berry))}
.prog i::after{content:"";position:absolute;inset-inline-end:-4px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 4px rgba(200,164,106,.25),0 0 12px var(--gold)}

/* الدخول */
.q{animation:in .55s var(--ease) both}
.q .st{animation:in .5s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms + 80ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--plum);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:99px;padding:3px 12px;letter-spacing:.3px}
.kicker svg{width:15px;height:15px;color:var(--gold)}
html[lang=en] .kicker{text-transform:uppercase;letter-spacing:1.2px;font-size:11.5px}
h1{font:700 clamp(32px,8vw,50px)/1.25 var(--display);margin:12px 0 10px;letter-spacing:-.3px;
   background:linear-gradient(110deg,var(--plum) 0%,var(--berry) 40%,var(--gold) 50%,var(--berry) 60%,var(--plum) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
html[lang=en] h1{font-size:clamp(40px,9vw,62px);line-height:1.05;letter-spacing:0;font-weight:600}
h2{font:600 clamp(22px,5.4vw,28px)/1.45 var(--display);margin:0 0 6px}
html[lang=en] h2{font-size:clamp(28px,6vw,36px);line-height:1.15}
.sub{color:var(--mute);margin:0 0 20px;font-size:15px}

/* بطاقات البداية */
.cta{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;text-align:start;border:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--sh2);transition:transform .25s var(--ease),box-shadow .25s}
.cta:hover{transform:translateY(-3px);box-shadow:var(--sh)}.cta:active{transform:scale(.985)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);transition:left .7s var(--ease)}
.cta:hover::after{left:120%}
.cta .ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--blush);color:var(--plum);flex:0 0 auto}
.cta .ic svg{width:26px;height:26px}
.cta b{display:block;font-size:18px;font-weight:600}.cta span{display:block;color:var(--mute);font-size:14px;line-height:1.5}
.cta .go-ar{margin-inline-start:auto;color:var(--berry)}
.cta.main{background:linear-gradient(135deg,var(--plum),var(--berry));border-color:transparent;color:#fff;box-shadow:var(--sh)}
.cta.main .ic{background:rgba(255,255,255,.16);color:#fff}.cta.main span{color:rgba(255,255,255,.84)}.cta.main .go-ar{color:#fff}
.cta.gift{background:linear-gradient(135deg,#fffaf2,#fff);border-color:rgba(200,164,106,.45)}
.cta.gift .ic{background:linear-gradient(140deg,#f6e7c9,#fff3dd);color:#9a7432}.cta.gift .go-ar{color:#9a7432}

/* الخيارات */
.opts{display:grid;gap:10px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-align:start;border:1px solid var(--line);background:rgba(255,255,255,.84);border-radius:18px;padding:14px 16px;box-shadow:var(--sh2);transition:transform .2s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--sh)}.opt:active{transform:scale(.985)}
.opt .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--blush);color:var(--plum);transition:.25s var(--ease);flex:0 0 auto}
.opt b{display:block;font-weight:600;font-size:16px;line-height:1.45}.opt small{display:block;color:var(--mute);font-size:13px;line-height:1.45}
.opt .ck{margin-inline-start:auto;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(115,45,105,.25);display:grid;place-items:center;color:#fff;transition:.2s;flex:0 0 auto}
.opt .ck svg{width:14px;height:14px;stroke-width:2.4;opacity:0;transform:scale(.4);transition:.25s var(--ease)}
.opt.on{border-color:var(--berry);background:#fff;box-shadow:0 0 0 3px rgba(167,36,108,.1)}
.opt.on .ic{background:linear-gradient(140deg,var(--plum),var(--berry));color:#fff;transform:rotate(-6deg) scale(1.05)}.opt.on .ck{background:var(--berry);border-color:var(--berry)}.opt.on .ck svg{opacity:1;transform:none}
.ripple{position:absolute;border-radius:50%;background:rgba(167,36,108,.16);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* بطاقات الروائح */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.84);border-radius:20px;padding:16px 8px 13px;text-align:center;box-shadow:var(--sh2);transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.card:hover .ic{transform:translateY(-2px) rotate(-8deg)}
.card .ic{width:54px;height:54px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:var(--plum);background:linear-gradient(140deg,var(--blush),#fff);border:1px solid var(--line);transition:.3s var(--ease)}
.card .ic svg{width:27px;height:27px}
.card b{display:block;font-size:14.5px;font-weight:600;line-height:1.4}.card small{display:block;color:var(--mute);font-size:12px;line-height:1.4;margin-top:2px}
.card .mk{position:absolute;top:8px;inset-inline-start:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:0;transform:scale(.4);transition:.25s var(--ease)}
.card .mk svg{width:13px;height:13px;stroke-width:2.6}
.card.on{border-color:var(--berry);box-shadow:0 0 0 3px rgba(167,36,108,.1)}.card.on .ic{background:linear-gradient(140deg,var(--plum),var(--berry));color:#fff;transform:scale(1.08)}
.card.on .mk{opacity:1;transform:none;background:var(--berry)}
.card.no{border-color:var(--bad);box-shadow:0 0 0 3px rgba(180,45,60,.09)}.card.no .ic{background:#fbe9eb;color:var(--bad)}.card.no .mk{opacity:1;transform:none;background:var(--bad)}
@media (max-width:370px){.cards{grid-template-columns:repeat(2,1fr)}}

/* الأزرار */
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:20px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--plum),var(--berry));color:#fff;font-weight:600;padding:16px;font-size:17px;box-shadow:var(--sh);transition:transform .2s var(--ease),opacity .2s}
.go:active{transform:scale(.985)}.go:disabled{opacity:.35;box-shadow:none;cursor:default}
.go svg{width:20px;height:20px}
.skip{display:block;margin:12px auto 0;border:0;background:none;color:var(--mute);text-decoration:underline;text-underline-offset:4px;font-size:14px}

/* البحث */
.sbox{position:relative}
.sbox svg{position:absolute;top:50%;inset-inline-start:16px;transform:translateY(-50%);color:var(--plum);opacity:.7}
.sbox input{width:100%;border:1px solid var(--line);border-radius:18px;padding:16px;padding-inline-start:50px;font-size:16.5px;background:#fff;box-shadow:var(--sh2);transition:.2s}
.sbox input:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 4px rgba(167,36,108,.1)}
.res{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:8px;overflow:hidden;box-shadow:var(--sh);animation:in .3s var(--ease) both}
.hit{display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;text-align:start;transition:background .15s}
.hit:last-child{border-bottom:0}.hit:hover{background:var(--blush2)}
.hit img,.hit .ph{width:46px;height:46px;object-fit:contain;flex:0 0 46px;border-radius:10px;background:var(--blush2)}
.hit .ph{display:grid;place-items:center;color:rgba(115,45,105,.45)}
.hit b{display:block;font-size:14.5px;font-weight:500;line-height:1.45}.hit small{color:var(--mute);font-size:12px}
.badge{display:inline-block;background:#e6f4ec;color:var(--ok);border-radius:99px;font-size:11px;font-weight:600;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--berry);border-radius:99px;padding:4px 6px;padding-inline-start:14px;font-size:14px;animation:pop .35s var(--ease) both}
.chip button{border:0;background:var(--blush);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;padding:0;color:var(--plum)}
.chip button svg{width:13px;height:13px;stroke-width:2.2}
.empty{padding:14px;color:var(--mute);font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;margin:12px 0;line-height:1.6}
.note svg{width:19px;height:19px;color:var(--plum);margin-top:2px}
.note.ok{border-color:#bfe3cc;background:#f3fbf6}.note.ok svg{color:var(--ok)}

/* التجهيز */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52vh;text-align:center;color:var(--plum)}
.rings{position:relative;width:110px;height:110px;margin-bottom:20px}
.rings i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--berry);animation:ring 1.8s var(--ease) infinite;opacity:0}
.rings i:nth-child(2){animation-delay:.45s;border-color:var(--gold)}.rings i:nth-child(3){animation-delay:.9s}
.rings svg{position:absolute;inset:34px;width:42px;height:42px;animation:spray 1.8s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.2);opacity:0}}
@keyframes spray{50%{transform:translateY(-4px) rotate(-6deg)}}
.loading p{margin:0;font-weight:600;font-size:17px}.loading small{color:var(--mute)}

/* النتائج */
.rhead .tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.rhead .tags span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:12.5px;color:var(--plum)}
.grid{display:grid;gap:16px;margin-top:14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--sh2);animation:rise .7s var(--ease) both;animation-delay:calc(var(--i) * 120ms);transition:transform .3s var(--ease),box-shadow .3s}
.pc:hover{box-shadow:var(--sh)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.pc.out{animation:out .3s var(--ease) both}@keyframes out{to{opacity:0;transform:scale(.9) rotate(-2deg)}}
.pc.top{border-color:rgba(200,164,106,.55);box-shadow:0 0 0 3px rgba(200,164,106,.14),var(--sh2)}
.pc .img{position:relative;height:210px;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 55%,#fff 0%,var(--blush) 100%);overflow:hidden}
.pc .img img{max-width:72%;max-height:180px;object-fit:contain;transition:transform .5s var(--ease)}
.pc:hover .img img{transform:scale(1.06) rotate(-2deg)}
.pc .rib{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#b48a45,var(--gold),#d9bd86);color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:3px 12px;z-index:1;box-shadow:0 4px 12px -4px rgba(154,116,50,.6)}
.pc .rib svg{width:13px;height:13px}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:2;animation:burst .9s var(--ease) forwards;box-shadow:0 0 6px var(--gold2)}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.pc .br{color:var(--mute);font-size:12.5px;letter-spacing:.3px}
.pc h3{margin:2px 0 4px;font-size:17px;line-height:1.45;font-weight:600}
.price{font-weight:700;color:var(--plum);font-size:16px}.price s{color:var(--mute);font-weight:400;font-size:13px;margin-inline-start:6px}
.why{margin:10px 0 0;padding:0;list-style:none;font-size:13.5px;line-height:1.55}
.why li{display:flex;gap:7px;margin:5px 0}.why li svg{width:16px;height:16px;color:var(--berry);margin-top:3px;stroke-width:2.2}
.acc{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 14px}
.acc span{background:var(--blush2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--plum)}
.pc .act{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px;background:linear-gradient(135deg,var(--plum),var(--berry));color:#fff;text-decoration:none;font-weight:600;font-size:15px;transition:filter .2s}
.btn:hover{filter:brightness(1.08)}
.nope{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:13.5px;color:var(--mute);transition:.2s;white-space:nowrap}
.nope:hover{color:var(--bad);border-color:rgba(180,45,60,.35)}.nope svg{width:17px;height:17px}
.more{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.more button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);color:var(--plum);background:rgba(255,255,255,.86);border-radius:99px;padding:9px 16px;font-weight:500;font-size:14px;box-shadow:var(--sh2);transition:.2s}
.more button:hover{border-color:var(--berry);transform:translateY(-1px)}.more button svg{width:17px;height:17px}
.share{position:relative;overflow:hidden;background:linear-gradient(135deg,#5e2357,var(--plum) 45%,var(--berry));color:#fff;border-radius:26px;padding:22px;margin-top:26px;box-shadow:var(--sh)}
.share::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);top:-120px;inset-inline-end:-80px;animation:breathe2 6s ease-in-out infinite}
@keyframes breathe2{50%{transform:scale(1.2)}}
.share b{display:block;font-size:12.5px;opacity:.8;font-weight:500}.share p{margin:6px 0 14px;font:500 19px/1.6 var(--display)}
html[lang=en] .share p{font-size:24px;line-height:1.3}
.share a{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--plum);border-radius:99px;padding:9px 18px;font-weight:600;text-decoration:none;font-size:14px}
.share a svg{width:18px;height:18px}
.sets h4{margin:26px 0 0;font-size:17px;font-weight:600}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:28px}

/* السوايب — الاتجاه ثابت في اللغتين: اليمين = أعجبني */
.deck{position:relative;height:min(470px,56vh);min-height:400px;margin:8px auto 14px;max-width:380px}
.deck .ghost{position:absolute;inset:0;border-radius:28px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh2)}
.deck .ghost.g1{transform:translateY(16px) scale(.94);opacity:.7}.deck .ghost.g2{transform:translateY(30px) scale(.88);opacity:.4}
.sc{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;cursor:grab;
    box-shadow:0 20px 50px -20px rgba(115,45,105,.45),0 0 0 4px var(--glow,transparent);transition:transform .35s var(--ease),opacity .35s,box-shadow .2s;animation:deal .45s var(--ease) both}
@keyframes deal{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.sc.drag{transition:box-shadow .2s;cursor:grabbing}
.sc .img{height:58%;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 55%,#fff 0%,var(--blush) 100%);position:relative}
.sc .img img{max-width:70%;max-height:88%;object-fit:contain;pointer-events:none}
.sc .bd{padding:14px 18px;text-align:center}
.sc .br{color:var(--mute);font-size:13px}.sc h3{margin:2px 0 8px;font-size:20px;line-height:1.4;font-weight:600}
.sc .fam{display:inline-flex;align-items:center;gap:7px;color:var(--plum);font-weight:600;font-size:14.5px}
.sc .fam svg{width:20px;height:20px}
.sc .acc{justify-content:center;margin:8px 0 0}
.sc .tag{position:absolute;top:22px;z-index:2;font-weight:700;font-size:19px;border:2.5px solid;border-radius:12px;padding:2px 12px;opacity:0;background:rgba(255,255,255,.88)}
.sc .tag.yes{left:18px;color:var(--ok);transform:rotate(-10deg)}.sc .tag.no{right:18px;color:var(--bad);transform:rotate(10deg)}
.sc .stock{position:absolute;top:14px;z-index:1;right:14px}
.sbtns{display:flex;justify-content:center;align-items:center;gap:20px;direction:ltr}
.sbtns button{border:1px solid var(--line);background:#fff;border-radius:99px;box-shadow:var(--sh2);display:grid;place-items:center;transition:transform .2s var(--ease),box-shadow .2s}
.sbtns button:hover{transform:translateY(-2px);box-shadow:var(--sh)}.sbtns button:active{transform:scale(.9)}
.sbtns .no,.sbtns .yes{width:66px;height:66px}.sbtns .no{color:var(--bad)}.sbtns .yes{color:#fff;background:linear-gradient(135deg,var(--plum),var(--berry));border-color:transparent}
.sbtns .no svg,.sbtns .yes svg{width:28px;height:28px;stroke-width:2}
.sbtns .mid{padding:11px 18px;font-size:14px;color:var(--mute)}
.shint{display:flex;justify-content:space-between;max-width:300px;margin:8px auto 0;font-size:12px;color:var(--mute);direction:ltr}
.count{color:var(--mute);font-size:13px;text-align:center;margin-top:6px}
.taste{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-top:16px;font-size:13.5px}
.taste b{font-size:12.5px;color:var(--mute);font-weight:500}.taste .t{display:flex;align-items:center;gap:10px;margin-top:6px}
.taste .t span{flex:0 0 130px}.taste .t i{display:block;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--plum),var(--berry));transition:width .5s var(--ease)}
@media (min-width:980px){.stage .taste{display:none}}
.toast{position:fixed;top:70px;left:50%;width:max-content;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid rgba(200,164,106,.5);border-radius:20px;padding:10px 16px;padding-inline-start:10px;box-shadow:0 18px 40px -14px rgba(115,45,105,.45);animation:toast 3.2s var(--ease) both;max-width:92vw}
.toast img{width:44px;height:44px;object-fit:contain;border-radius:12px;background:var(--blush2);mix-blend-mode:multiply}
.toast b{display:block;font-size:13.5px}.toast a{font-size:13px;font-weight:600}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-16px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px)}}

/* الثقة */
.trust{max-width:1200px;margin:0 auto 14px;padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}
.trust div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.45}
.trust svg{color:var(--plum);width:24px;height:24px}.trust b{display:block;font-weight:600;font-size:13.5px}.trust span{color:var(--mute);font-size:12px}
.proto{text-align:center;font-size:11.5px;color:var(--mute);margin:0 0 26px}

.pc .img img,.sc .img img,.hit img{mix-blend-mode:multiply}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

        '<div class="bd"><div class="br">' + esc(br(p)) + '</div><h3>' + esc(nm(p.pid)) + '</h3>' +
        '<div class="price">' + esc(t('from', money(p.price))) + (p.reg > p.price ? '<s>' + money(p.reg) + '</s>' : '') + '</div>' +
        '<ul class="why">' + rs.map(function (r) { return '<li>' + ic('check') + '<span>' + esc(r) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="acc">' + topAccords(x.f, 3).map(function (a) { return '<span>' + esc(a) + '</span>'; }).join('') + '</div>' +
        '<div class="act"><a class="btn" href="' + esc(lurl(p.url)) + '?ref=quiz" target="_blank" data-open="' + p.pid + '">' + t('view') + '</a>' +
        '<button class="nope" data-nope="' + p.pid + '" title="' + esc(t('nopeT')) + '">' + ic('refresh') + t('nope') + '</button></div></div></article>';
    }).join('') + '</div>';
    html += '<div class="more"><button data-mode="different2">' + ic('compass') + t('mDiff') + '</button><button data-mode="rare">' + ic('spark') + t('mRare') + '</button>' +
      '<button data-act="back">' + ic('sliders') + t('mEdit') + '</button><button data-act="restart">' + ic('refresh') + t('mRestart') + '</button></div>';
    if (st.gift) {
      var gr = genderRange(), bud = BUDGETS.filter(function (b) { return b.k === st.budget; })[0];
      var sets = D.sets.filter(function (s) { return s[2] <= bud.max && (s[5] == null || (s[5] >= gr[0] && s[5] <= gr[1])); }).slice(-2);
      if (sets.length) html += '<div class="sets"><h4>' + t('sets') + '</h4><div class="grid">' + sets.map(function (s, k) {
        var sn = EN && s[6] ? s[6] + ' Gift Set' : short(s[0]), sb = EN && s[7] ? s[7] : s[1];
        return '<article class="pc" style="--i:' + (k + 3) + '"><div class="img"><img src="' + esc(full(s[4], D.img0)) + '" alt=""></div><div class="bd"><div class="br">' + esc(sb) + '</div><h3>' + esc(sn) + '</h3><div class="price">' + money(s[2]) + '</div>' +
          '<div class="act" style="margin-top:14px"><a class="btn" href="' + esc(lurl(full(s[3], D.url0))) + '?ref=quiz" target="_blank">' + t('viewSet') + '</a></div></div></article>';
      }).join('') + '</div></div>';
    }
    var prof = profile();
    if (prof && !st.gift) html += '<div class="share"><b>' + t('prof') + '</b><p>' + esc(prof) + '</p><a target="_blank" href="https://wa.me/?text=' +
      encodeURIComponent(prof + '\n' + t('waT') + ' https://paris-avenues.com/' + (EN ? 'en' : 'ar')) + '">' + ic('wa') + t('wa') + '</a></div>';
    html += '<p class="foot">' + (PROD ? t('footP') : t('foot', D.built)) + '</p>';
    if (prev.length && nextStep.cur === 'results' && app.querySelector('.grid')) {
      var sy = window.scrollY, sec = app.querySelector('section.q');
      sec.style.animation = 'none'; sec.innerHTML = html; window.scrollTo(0, sy);
    } else { shell('results', html); setTimeout(burst, 650); }
    bindTilt();
    drawShow('results');
    track('quiz_results', {path: st.path, n: pick.length});
  }
  function burst() {
    var rib = app.querySelector('.pc.top .rib'); if (!rib || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var k = 0; k < 14; k++) {
      var s = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 45;
      s.className = 'spark'; s.style.left = (rib.offsetLeft + rib.offsetWidth / 2) + 'px'; s.style.top = (rib.offsetTop + rib.offsetHeight / 2) + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px'); s.style.animationDelay = (Math.random() * 120) + 'ms';
      rib.parentNode.appendChild(s); setTimeout(function (el) { return function () { el.remove(); }; }(s), 1200);
    }
  }
  function bindTilt() {
    if (!matchMedia('(hover: hover)').matches) return;
    app.querySelectorAll('.pc').forEach(function (c) {
      c.addEventListener('mousemove', function (e) {
        var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        c.style.transform = 'perspective(900px) rotateY(' + (x * 6) + 'deg) rotateX(' + (-y * 6) + 'deg) translateY(-4px)';
      });
      c.addEventListener('mouseleave', function () { c.style.transform = ''; });
    });
  }
  function profile() {
    var f = st.path === 'known' ? anchorF() : null, words = [];
    if (st.path === 'discover' && st.method === 'swipe') words = tasteBars().slice(0, 2).map(function (x) { return x[0]; });
    else if (st.path === 'discover') words = st.likes.map(function (k) { return cl(CARD[k]); });
    else if (f) {
      var tmp = {raw: {}, sum: 0}; st.anchors.forEach(function (pid) { var a = fp(pid); for (var i in a.raw) { tmp.raw[i] = (tmp.raw[i] || 0) + a.raw[i]; tmp.sum += a.raw[i]; } });
      words = CARDS.map(function (c) { return [cl(c), share(tmp, c.g)]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 2).map(function (x) { return x[0]; });
    }
    if (!words.length) return '';
    var pres = st.tie && st.tie.d === 'sil' ? (st.tie.v === 'low' ? t('pLow') : t('pHigh')) : st.occasion === 'office' ? t('pOffice') : st.occasion === 'evening' ? t('pEve') : '';
    return t('profT', join(EN ? words.map(function (w) { return w.toLowerCase(); }) : words), pres);
  }

  // ---------- شاشة السوايب
  function drawSwipe() {
    var n = st.swipes.length, likes = liked().length;
    var enough = (likes >= 3 && n >= 8) || n >= st.swipeCap;
    var c = enough ? null : nextCard();
    var bars = tasteBars(), maxb = bars.length ? bars[0][1] : 1;
    var html = '<h2>' + (c ? t('sh') : likes ? t('sDone') : t('sNone')) + '</h2>';
    if (c) {
      var f = fp(c.pid), card = CARD[c.fam];
      html += '<p class="sub">' + t('shs') + '</p>' +
        '<div class="deck"><div class="ghost g2"></div><div class="ghost g1"></div><div class="sc" id="sc"><span class="tag yes">' + t('sYes') + '</span><span class="tag no">' + t('sNo') + '</span>' +
        (c.pool >= 0 ? '<span class="badge stock">' + t('stock2') + '</span>' : '') +
        '<div class="img"><img src="' + esc(c.img) + '" alt=""></div><div class="bd"><div class="br">' + esc(EN ? c.ben : c.bar) + '</div><h3>' + esc(nm(c.pid)) + '</h3>' +
        '<div class="fam">' + ic(c.fam) + cl(card) + '</div><div class="acc">' + topAccords(f, 3).map(function (a) { return '<span>' + esc(a) + '</span>'; }).join('') + '</div></div></div></div>' +
        '<div class="sbtns"><button class="no" data-sw="-1" aria-label="' + esc(t('sHintL')) + '">' + ic('x') + '</button><button class="mid" data-sw="0">' + t('sMid') + '</button><button class="yes" data-sw="1" aria-label="' + esc(t('sHintR')) + '">' + ic('heart') + '</button></div>' +
        '<div class="shint"><span>' + t('sHintL') + '</span><span>' + t('sHintR') + '</span></div>' +
        '<div class="count">' + t('of', n + 1, likes >= 3 ? Math.max(8, n + 1) : st.swipeCap) + '</div>';
    } else if (likes) {
      html += '<p class="sub">' + t('sDoneS', n) + '</p><button class="go" data-act="swdone">' + t('sCont') + ic('next') + '</button>';
    } else {
      html += '<p class="sub">' + t('sNoneS') + '</p><button class="go" data-act="swmore">' + t('sMore') + '</button><button class="skip" data-act="swcards">' + t('sCards') + '</button>';
    }
    if (bars.length) html += '<div class="taste"><b>' + t('taste') + '</b>' + bars.slice(0, 3).map(function (b) {
      return '<div class="t"><span>' + esc(b[0]) + '</span><i style="width:' + Math.max(8, Math.round(100 * b[1] / maxb)) + '%"></i></div>'; }).join('') + '</div>';
    if (n >= 5 && likes >= 1 && c) html += '<button class="skip" data-act="swdone">' + t('sEnough') + '</button>';
    shell('swipe', html);
    if (c) { drawSwipe.cur = c.pid; bindDrag(document.getElementById('sc')); }
  }
  function toast(pid) {
    var s = SBY[pid], old = document.querySelector('.toast'); if (old) old.remove();
    var el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = '<img src="' + esc(s.img) + '" alt=""><span><b>' + esc(t('sMatch', nm(pid))) + '</b>' + vlink(s.url, t('view')) + '</span>';
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 3300);
  }
  function doSwipe(v) {
    var pid = drawSwipe.cur, el = document.getElementById('sc');
    if (!pid) return;
    drawSwipe.cur = null;
    track('quiz_swipe', {pid: pid, v: v});
    if (v === 1 && SBY[pid].pool >= 0) toast(pid);
    if (v === 1) ensure([pid]);
    function commit() { go(function () { st.swipes.push({pid: pid, v: v}); }); }
    if (!el) return commit();
    el.style.setProperty('--glow', v === 1 ? 'rgba(31,138,76,.35)' : v === -1 ? 'rgba(180,45,60,.3)' : 'transparent');
    el.style.transform = v === 0 ? 'translateY(-120%) scale(.9)' : 'translateX(' + (v === 1 ? 140 : -140) + '%) rotate(' + (v === 1 ? 20 : -20) + 'deg)';
    el.style.opacity = '0';
    setTimeout(commit, 260);
  }
  function bindDrag(el) {
    if (!el) return;
    var x0 = 0, y0 = 0, dx = 0, dy = 0, on = false, yes = el.querySelector('.tag.yes'), no = el.querySelector('.tag.no');
    el.addEventListener('pointerdown', function (e) { on = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', function (e) {
      if (!on) return; dx = e.clientX - x0; dy = e.clientY - y0;
      el.style.transform = 'translate(' + dx + 'px,' + Math.min(0, dy) + 'px) rotate(' + dx / 16 + 'deg)';
      var a = Math.max(0, Math.min(1, dx / 90)), b = Math.max(0, Math.min(1, -dx / 90));
      yes.style.opacity = a; no.style.opacity = b;
      el.style.setProperty('--glow', a ? 'rgba(31,138,76,' + a * .35 + ')' : b ? 'rgba(180,45,60,' + b * .3 + ')' : 'transparent');
    });
    function end() {
      if (!on) return; on = false; el.classList.remove('drag');
      if (dx > 90) return doSwipe(1);
      if (dx < -90) return doSwipe(-1);
      if (dy < -110 && Math.abs(dx) < 60) return doSwipe(0);
      el.style.transform = ''; yes.style.opacity = no.style.opacity = 0; el.style.setProperty('--glow', 'transparent');
    }
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }

  // ---------- الأحداث
  function ripple(b, e) {
    var r = b.getBoundingClientRect(), s = document.createElement('span'), d = Math.max(r.width, r.height);
    s.className = 'ripple'; s.style.width = s.style.height = d + 'px';
    s.style.left = ((e.clientX || r.left + r.width / 2) - r.left - d / 2) + 'px'; s.style.top = ((e.clientY || r.top + r.height / 2) - r.top - d / 2) + 'px';
    b.appendChild(s); setTimeout(function () { s.remove(); }, 650);
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button,a'); if (!b) return;
    var key = nextStep.cur, d = b.dataset;
    if (b.classList.contains('opt') || b.classList.contains('cta') || b.classList.contains('card')) ripple(b, e);
    if (d.act === 'back') return back();
    if (d.act === 'restart') { reset(); return render(); }
    if (d.path) return go(function () { st.path = d.path; if (d.path === 'discover') st.dislikes = null; });
    if (d.gift) return go(function () { st.gift = true; });
    if (d.pid) {
      var pid = +d.pid; b.disabled = true;
      ensure([pid]).then(function () {
        if (!fp(pid)) return;
        if (st.anchors.indexOf(pid) < 0 && st.anchors.length < 2) st.anchors.push(pid);
        var q = document.getElementById('q'); if (q) q.value = ''; var hs = document.getElementById('hits'); if (hs) hs.innerHTML = '';
        drawChips(); track('quiz_anchor', pid);
      });
      return;
    }
    if (d.rm) { st.anchors = st.anchors.filter(function (x) { return x !== +d.rm; }); return drawChips(); }
    if (d.nope) {
      var card = b.closest('.pc'); track('quiz_nope', d.nope);
      if (card) card.classList.add('out');
      setTimeout(function () { st.nope.push(+d.nope); drawResults(); }, 280);
      return;
    }
    if (d.open) return track('quiz_open', d.open);
    if (d.mode) return go(function () { st.shown = st.shown.concat(st.cur || []); st.cur = null; st.mode = d.mode; });
    if (d.sw != null) return doSwipe(+d.sw);
    if (d.act === 'swdone') return go(function () { st.swipeDone = true; });
    if (d.act === 'swmore') return go(function () { st.swipeCap += 6; });
    if (d.act === 'swcards') return go(function () { st.method = 'cards'; st.swipes = []; });
    if (d.card) {
      if (key === 'likes') { toggle(st.likes, d.card, 2); b.classList.toggle('on', st.likes.indexOf(d.card) >= 0); document.querySelector('.go').disabled = !st.likes.length; drawShow(key); return; }
      st._dis = st._dis || []; toggle(st._dis, d.card, 3); b.classList.toggle('no', st._dis.indexOf(d.card) >= 0); return;
    }
    if (d.act === 'nodis') return go(function () { st.dislikes = []; st._dis = []; });
    if (d.act === 'next') {
      if (key === 'dislikes') return go(function () { st.dislikes = (st._dis || []).slice(); });
      return go(function () {});
    }
    if (d.v != null) {
      var v = d.v;
      if (key === 'tweak') { toggle(st.tweaks, v, 2); b.classList.toggle('on', st.tweaks.indexOf(v) >= 0); document.querySelector('.go').disabled = !st.tweaks.length; return; }
      if (render.busy) return; render.busy = true;
      b.classList.add('on');
      setTimeout(function () {
        go(function () {
          if (key === 'giftKnows') { st.giftKnows = v; st.path = v === 'yes' ? 'known' : 'giftUnknown'; }
          else if (key === 'intent') { st.intent = v; st.tweaks = []; st.why = null; }
          else if (key === 'why') st.why = v;
          else if (key === 'gender') st.gender = v;
          else if (key === 'method') st.method = v;
          else if (key === 'style') st.style = v;
          else if (key === 'occasion') st.occasion = v;
          else if (key === 'budget') { st.budget = v; delete st.tie; delete st.tieQ; }
          else if (key === 'tie') st.tie = v === 'any' ? null : {d: st.tieQ.d, v: v};
        });
      }, 200);
    }
  });
  function toggle(arr, v, max) { var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else { if (arr.length >= max) arr.shift(); arr.push(v); } }

  function render() {
    var key = nextStep();
    nextStep.cur = key; render.busy = false;
    document.body.classList.toggle('is-results', key === 'results');
    R[key]();
    if (key !== 'results') drawShow(key);
  }
  function applyLang() {
    EN = LANG === 'en'; setAcc();
    document.documentElement.lang = LANG; document.documentElement.dir = EN ? 'ltr' : 'rtl';
    document.title = t('title');
    document.getElementById('storeTxt').textContent = t('store');
    document.getElementById('storeLink').href = 'https://paris-avenues.com/' + (EN ? 'en' : 'ar');
    document.getElementById('lang').innerHTML = ic('globe') + t('langBtn');
    document.getElementById('proto').textContent = PROD ? '' : t('proto');
    document.getElementById('trust').innerHTML = ['shield', 'returnI', 'cardI', 'gift'].map(function (icn, k) {
      var x = t('trust')[k]; return '<div>' + ic(icn) + '<span><b>' + x[0] + '</b><span>' + x[1] + '</span></span></div>'; }).join('');
    famousCache = {};
  }
  document.getElementById('lang').addEventListener('click', function () {
    LANG = EN ? 'ar' : 'en'; try { localStorage.setItem('pa_quiz_lang', LANG); } catch (e) {}
    applyLang(); if (nextStep.cur === 'results' && st.cur) drawResults(); else render();
  });
  (function () { var bg = document.getElementById('bg'); for (var k = 0; k < 10; k++) { var b = document.createElement('b'); b.style.left = (5 + Math.random() * 90) + '%'; b.style.animationDelay = (-Math.random() * 14) + 's'; b.style.animationDuration = (11 + Math.random() * 8) + 's'; bg.appendChild(b); } })();
  window.addEventListener('resize', function () { drawShow(nextStep.cur); });
  applyLang(); reset();
  var start = qs.get('start');
  if (start === 'known' || start === 'discover') { hist.push(JSON.stringify(st)); st.path = start; if (start === 'discover') st.dislikes = null; }
  else if (start === 'gift') { hist.push(JSON.stringify(st)); st.gift = true; }
  render();
  setTimeout(loadSearch, 2500);
})();
</script>
